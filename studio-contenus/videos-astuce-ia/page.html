<!doctype html><html><head><meta charset="utf-8"><style>
@font-face{font-family:SG;src:url(polices/space-grotesk-latin-700-normal.woff2)}
@font-face{font-family:SG;src:url(polices/space-grotesk-latin-ext-700-normal.woff2);unicode-range:U+0100-024F}
@font-face{font-family:PX;font-weight:400;src:url(polices/ibm-plex-sans-latin-400-normal.woff2)}
@font-face{font-family:PX;font-weight:500;src:url(polices/ibm-plex-sans-latin-500-normal.woff2)}
@font-face{font-family:PX;font-weight:600;src:url(polices/ibm-plex-sans-latin-600-normal.woff2)}
:root{--v:#8E2A8E;--vf:#6A1E6C;--vn:#43124A;--o:#F0921F;--ot:#F8A63E;--b:#2E8CB2;--e:#1C1620;--g:#6E6675;--m:#F6ECF6}
*{box-sizing:border-box;margin:0;padding:0}
body{width:1080px;height:1920px;overflow:hidden;background:#000}
#root{position:relative;width:1080px;height:1920px;overflow:hidden;font-family:PX;color:#fff;
 background:radial-gradient(1200px 900px at 85% 10%,#A8399F 0%,transparent 60%),linear-gradient(165deg,#9C319C 0%,#7A2179 45%,#3E1046 100%)}
.cercle{position:absolute;border-radius:50%;border:2px solid rgba(255,255,255,.08)}
#entete{position:absolute;left:60px;right:60px;top:70px;height:110px;display:flex;align-items:center;justify-content:space-between}
#logo{background:#fff;border-radius:26px;padding:16px 26px;height:100px;display:flex;align-items:center}
#logo img{height:66px}
#badge{font-family:SG;font-size:34px;letter-spacing:2px;text-transform:uppercase;background:var(--o);color:#fff;padding:18px 30px;border-radius:60px}
#prog{position:absolute;left:60px;right:60px;top:212px;height:8px;border-radius:8px;background:rgba(255,255,255,.18)}
#prog i{display:block;height:100%;width:0;border-radius:8px;background:var(--o)}
.scene{position:absolute;left:0;top:250px;width:1080px;height:1290px;opacity:0}
#sous{position:absolute;left:50px;right:50px;top:1560px;min-height:220px;display:flex;align-items:center;justify-content:center;
 background:rgba(20,6,24,.72);border-radius:34px;padding:26px 40px;text-align:center;font-weight:600;font-size:46px;line-height:1.25}
#pied{position:absolute;left:0;right:0;bottom:44px;text-align:center;font-size:30px;color:rgba(255,255,255,.7);letter-spacing:1px}
.kicker{font-family:SG;font-size:40px;color:var(--ot);text-transform:uppercase;letter-spacing:3px}
.grand{font-family:SG;font-size:112px;line-height:1.02;letter-spacing:-1px}
.grand b,.moyen b{color:var(--ot);font-weight:700}
.moyen{font-family:SG;font-size:76px;line-height:1.08}
.carte{background:#fff;color:var(--e);border-radius:36px;box-shadow:0 30px 80px rgba(0,0,0,.35)}
.chip{display:inline-flex;align-items:center;gap:18px;font-family:SG;font-size:56px;padding:26px 40px;border-radius:80px;background:#fff;color:var(--vf);margin:14px 0}
.chip .n{width:68px;height:68px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:#fff;font-size:40px}
.tag{display:inline-block;font-family:SG;font-size:26px;color:#fff;padding:6px 16px;border-radius:30px;margin-right:10px;vertical-align:middle}
.seg{border-radius:10px;padding:2px 6px}
.curseur{position:absolute;width:56px;height:56px;z-index:9}
.cit{display:inline-flex;align-items:center;justify-content:center;min-width:40px;height:40px;border-radius:12px;background:#E9DDF4;color:var(--vf);font-size:26px;font-weight:600;margin-left:8px;vertical-align:middle}
</style></head><body><div id="root">
<div class="cercle" style="width:1400px;height:1400px;left:-700px;top:1100px"></div>
<div class="cercle" style="width:900px;height:900px;left:620px;top:-420px"></div>
<div id="entete"><div id="logo"><img src="logo.png"></div><div id="badge"></div></div>
<div id="prog"><i></i></div>
<div id="scenes"></div>
<div id="sous"></div>
<div id="pied">www.aite-consulting.com</div>
</div>
<script>
const COUL=['#8E2A8E','#F0921F','#2E8CB2','#3E9B5A'];
const cl=(x,a=0,b=1)=>Math.max(a,Math.min(b,x)), eo=x=>1-Math.pow(1-cl(x),3);
const ap=(t,d,l=.45)=>eo((t-d)/l);
const rel=s=>s.replace(/\*(.+?)\*/g,'<b>$1</b>');
const h=(html)=>{const d=document.createElement('div');d.innerHTML=html.trim();return d.firstChild};
const CURSEUR='<svg class="curseur" viewBox="0 0 24 24"><path d="M3 2l7 19 2.6-7.4L20 11z" fill="#fff" stroke="#1C1620" stroke-width="1.4" stroke-linejoin="round"/></svg>';
function tape(el,txt,p){el.textContent=txt.slice(0,Math.round(txt.length*cl(p)))}
const B={};
// ---------- titre (intro avec photo du DG)
B.titre=(s)=>{const el=h(`<div class="scene"><div style="position:absolute;left:70px;top:70px;width:640px">
 <div class="kicker">${s.kicker}</div><div class="grand" style="margin-top:30px">${rel(s.titre)}</div></div>
 <img src="dg.webp" style="position:absolute;right:-40px;bottom:-260px;height:1250px">
 <div style="position:absolute;left:70px;top:900px"><div style="font-family:SG;font-size:40px">Cyrille Donald ABOLO</div><div style="font-size:30px;opacity:.8;margin-top:6px">Directeur Général, AITE Consulting</div></div></div>`);
 const [txt,img,nom]=el.children;
 return {el,u(t){txt.style.transform=`translateY(${(1-ap(t,0))*60}px)`;txt.style.opacity=ap(t,0);img.style.opacity=ap(t,.15,.6);img.style.transform=`translateX(${(1-ap(t,.15,.7))*120}px)`;nom.style.opacity=ap(t,.6)}}};
// ---------- chips
B.chips=(s)=>{const el=h(`<div class="scene"><div style="padding:120px 80px 0"><div class="moyen">${rel(s.titre)}</div><div class="liste" style="margin-top:60px;display:flex;flex-direction:column;align-items:flex-start"></div></div></div>`);
 const L=el.querySelector('.liste');
 const items=s.items.map((x,i)=>{const c=h(`<div class="chip">${s.outils?'<span class="n" style="background:'+['#10A37F','#4A7CF7','#2E8CB2','#D97757','#F26B21'][i]+'">✓</span>':'<span class="n" style="background:'+COUL[i]+'">'+(i+1)+'</span>'}${x}</div>`);L.appendChild(c);return c});
 return {el,u(t,d){const pas=Math.min(.7,(d*.6)/items.length);items.forEach((c,i)=>{const p=ap(t,.3+i*pas,.4);c.style.opacity=p;c.style.transform=`translateX(${(1-p)*-80}px)`})}}};
// ---------- chat (formule du prompt)
const SEG=['Tu es mon assistant de direction. ','Rédige une relance pour un client. ','Il doit 2 factures depuis 45 jours, mais c’est un bon client depuis 5 ans : cordial mais ferme. ','Format : un message WhatsApp de 5 lignes maximum.'];
const NOMS=['Rôle','Tâche','Contexte','Format'];
B.chat=(s)=>{const el=h(`<div class="scene"><div style="padding:60px 60px 0">
 <div class="pills" style="display:flex;gap:14px;flex-wrap:wrap"></div>
 <div class="carte" style="margin-top:44px;padding:40px 44px">
  <div style="display:flex;align-items:center;gap:16px;font-family:SG;font-size:34px;color:var(--g)"><span style="width:22px;height:22px;border-radius:50%;background:#3E9B5A;display:inline-block"></span>Votre IA · nouvelle conversation</div>
  <div class="zone" style="margin-top:34px;border:3px solid #E7E3EC;border-radius:28px;padding:30px;font-size:50px;line-height:1.42;min-height:560px"></div>
  <div style="display:flex;justify-content:flex-end;margin-top:26px"><div class="env" style="background:var(--v);color:#fff;font-family:SG;font-size:34px;padding:16px 34px;border-radius:40px">Envoyer ➜</div></div>
 </div></div></div>`);
 const P=el.querySelector('.pills'),Z=el.querySelector('.zone');
 const pills=NOMS.map((n,i)=>{const p=h(`<div style="font-family:SG;font-size:38px;padding:14px 28px;border-radius:50px;border:3px solid #fff">${i+1}. ${n}</div>`);P.appendChild(p);return p});
 const segs=SEG.map((x,i)=>{const sp=h(`<span class="seg"></span>`);Z.appendChild(sp);return sp});
 return {el,u(t,d,e){pills.forEach((p,i)=>{const act=i==e,fait=i<e;p.style.background=act?'#fff':fait?'rgba(255,255,255,.25)':'transparent';p.style.color=act?COUL[i]:'#fff';p.style.borderColor=act?'#fff':'rgba(255,255,255,.6)';p.style.opacity=i<=e?1:.45;p.style.transform=act?`scale(${1+.08*Math.sin(Math.PI*cl(t/.5))})`:''});
  segs.forEach((sp,i)=>{if(i<e){sp.textContent=SEG[i]}else if(i==e){tape(sp,SEG[i],(t-.3)/(d*.6))}else sp.textContent='';
   sp.style.background=i==e?COUL[i]+'26':'transparent';sp.style.color=i==e?'#1C1620':'#6E6675';sp.style.boxShadow=i==e?`inset 0 -6px 0 ${COUL[i]}`:'none'})}}};
// ---------- mail (Copilot dans Outlook)
const MSG=[['AN','Aline N.','Re: Livraison chantier Bonapriso','On ne peut pas livrer le 12, le camion…'],['PK','Paul K.','Re: Livraison chantier Bonapriso','Si on décale au 20, il faut prévenir…'],['MT','Marc T.','Re: Livraison chantier Bonapriso','Le client accepte, mais il veut garder…'],['AN','Aline N.','Re: Livraison chantier Bonapriso','Je relance le transporteur demain…']];
const RES=[['La livraison passe du 12 au 20 novembre.',2],['Le client accepte si la remise de 5 % reste.',3],['Aline relance le transporteur demain.',4]];
B.mail=(s)=>{const el=h(`<div class="scene"><div style="padding:40px 50px 0;position:relative">
 <div class="carte" style="padding:34px 36px;position:relative">
  <div style="font-family:SG;font-size:40px">Livraison chantier Bonapriso</div><div style="font-size:30px;color:var(--g);margin-top:6px">40 messages · 6 participants</div>
  <div class="barre" style="margin-top:26px;border-radius:24px;border:3px solid #D9C6EC;background:linear-gradient(90deg,#F3EAFB,#EAF2FB);padding:22px 26px">
   <div style="display:flex;align-items:center;gap:16px;font-size:36px;font-weight:600;color:#5B2A86"><span style="font-size:40px">✦</span>Résumé par Copilot</div>
   <div class="res" style="overflow:hidden;height:0"></div></div>
  <div class="msgs" style="margin-top:20px"></div>
  <div class="pj" style="margin-top:18px;display:flex;align-items:center;gap:20px;border:3px solid #E7E3EC;border-radius:22px;padding:18px 22px;opacity:0">
   <div style="width:70px;height:84px;border-radius:10px;background:#D93F3F;color:#fff;font-weight:600;font-size:24px;display:flex;align-items:center;justify-content:center">PDF</div>
   <div style="flex:1"><div style="font-size:32px;font-weight:600">Planning_livraison.pdf</div><div style="font-size:26px;color:var(--g)">pièce jointe · 2,4 Mo</div></div>
   <div class="bf" style="font-size:28px;font-weight:600;color:#5B2A86;border:3px solid #D9C6EC;border-radius:40px;padding:12px 22px">✦ Résumer un fichier</div></div>
 </div>${CURSEUR}</div></div>`);
 const M=el.querySelector('.msgs'),R=el.querySelector('.res'),barre=el.querySelector('.barre'),pj=el.querySelector('.pj'),bf=el.querySelector('.bf'),cur=el.querySelector('.curseur');
 const msgs=MSG.map((m,i)=>{const d=h(`<div style="display:flex;gap:22px;padding:20px 8px;border-top:2px solid #EEE;border-radius:16px"><div style="width:70px;height:70px;border-radius:50%;background:${COUL[i%4]};color:#fff;display:flex;align-items:center;justify-content:center;font-weight:600;font-size:28px;flex:none">${m[0]}</div><div><div style="font-size:32px;font-weight:600">${m[1]} <span style="font-weight:400;color:var(--g);font-size:26px">· message ${i+1}</span></div><div style="font-size:30px;color:var(--g)">${m[3]}</div></div></div>`);M.appendChild(d);return d});
 const lignes=RES.map(r=>{const d=h(`<div style="font-size:34px;line-height:1.35;margin-top:16px;display:flex;gap:14px"><span style="color:#5B2A86">•</span><span>${r[0]}<span class="cit">${r[1]}</span></span></div>`);R.appendChild(d);return d});
 const pos=(x,y)=>{cur.style.left=x+'px';cur.style.top=y+'px'};
 return {el,u(t,d,e){
  msgs.forEach((m,i)=>{m.style.display=(e==2||e==3)&&i>1?'none':'flex';m.style.opacity=e==0?ap(t,.2+i*.18):1;m.style.background=(e==3&&i==1&&t>.6)?'#F6ECF6':'transparent'});
  const ouvert=e>=2?(e==2?ap(t,.1,.6):1):0; R.style.height=(ouvert*290)+'px';
  lignes.forEach((l,i)=>{l.style.opacity=e==2?ap(t,.4+i*.45):e>2?1:0});
  const c2=R.querySelectorAll('.cit')[0]; c2.style.background=(e==3)?'#F0921F':'#E9DDF4'; c2.style.color=(e==3)?'#fff':'#6A1E6C'; c2.style.transform=e==3?`scale(${1+.25*Math.sin(Math.PI*cl((t-.2)/.5))})`:'';
  barre.style.boxShadow=(e==1&&t>1)?`0 0 0 ${8*Math.sin(Math.PI*cl((t-1)/.5))}px rgba(142,42,142,.25)`:'none';
  pj.style.opacity=e==4?ap(t,.1):0; if(e==4){R.style.height='0px';lignes.forEach(l=>l.style.opacity=0)}
  bf.style.background=(e==4&&t>1.6)?'#F3EAFB':'transparent';
  cur.style.opacity=(e==1||e==3||e==4)?1:0;
  if(e==1){const p=ap(t,.2,.9);pos(760-p*440,900-p*700)}
  if(e==3){const p=ap(t,.1,.6);pos(500+p*300,560-p*0)}
  if(e==4){const p=ap(t,.4,1);pos(400+p*420,1100-p*(1100-(pj.offsetTop+70)))}
 }}};
// ---------- téléphone
B.telephone=(s)=>{const el=h(`<div class="scene"><div style="position:absolute;left:290px;top:60px;width:500px;height:1000px;border-radius:70px;background:#1C1620;padding:26px">
 <div style="background:#fff;border-radius:50px;height:100%;position:relative;overflow:hidden;color:var(--e)">
  <div style="padding:70px 34px 0;font-family:SG;font-size:32px">Livraison chantier Bonapriso</div>
  <div style="padding:20px 34px;font-size:24px;color:var(--g);line-height:1.5">Aline N. · On ne peut pas livrer le 12…<br>Paul K. · Si on décale au 20…<br>Marc T. · Le client accepte…</div>
  <div class="bar" style="position:absolute;left:0;right:0;bottom:0;height:120px;border-top:2px solid #EEE;display:flex;align-items:center;justify-content:space-around;font-size:40px;color:var(--g)">
   <span>↩</span><span>⤳</span><span class="ic" style="width:84px;height:84px;border-radius:24px;display:flex;align-items:center;justify-content:center;color:#5B2A86">✦</span><span>⋯</span></div>
  <div class="res" style="position:absolute;left:24px;right:24px;top:300px;border-radius:24px;background:linear-gradient(90deg,#F3EAFB,#EAF2FB);padding:22px;font-size:26px;line-height:1.4;opacity:0"><b style="color:#5B2A86">✦ Résumé par Copilot</b><br>• Livraison décalée au 20 novembre.<br>• Remise de 5 % maintenue.</div>
 </div></div></div>`);
 const ic=el.querySelector('.ic'),res=el.querySelector('.res'),tel=el.firstChild;
 return {el,u(t,d){tel.style.transform=`translateY(${(1-ap(t,0,.6))*120}px)`;const k=Math.sin(Math.PI*cl((t-1)/.6));ic.style.background=t>1?'#E9DDF4':'transparent';ic.style.transform=`scale(${1+.3*k})`;res.style.opacity=ap(t,1.7)}}};
// ---------- renommage NotebookLM → Gemini Notebook
B.renomme=(s)=>{const el=h(`<div class="scene"><div style="padding:200px 80px 0;text-align:center">
 <div class="a" style="font-family:SG;font-size:70px;opacity:.7;text-decoration:line-through;text-decoration-thickness:6px">NotebookLM</div>
 <div class="f" style="font-size:90px;margin:30px 0">↓</div>
 <div class="b carte" style="display:inline-block;font-family:SG;font-size:86px;padding:40px 60px;color:var(--vf)">Gemini Notebook</div>
 <div class="c" style="font-size:38px;margin-top:50px;opacity:.85">Nouveau nom depuis juillet 2026, même outil de Google</div></div></div>`);
 const [a,f,b,c]=el.firstChild.children;
 return {el,u(t){a.style.opacity=.7*ap(t,0);f.style.opacity=ap(t,.6);b.style.opacity=ap(t,.9);b.style.transform=`scale(${.85+.15*ap(t,.9,.6)})`;c.style.opacity=ap(t,1.5)}}};
// ---------- notebook
const SRC=[['PDF','#D93F3F','Appel_offres_DAO.pdf'],['DOC','#4A7CF7','Cahier des charges (Google Docs)'],['WEB','#3E9B5A','Page web du maître d’ouvrage']];
B.notebook=(s)=>{const el=h(`<div class="scene"><div style="padding:30px 50px 0">
 <div class="carte" style="padding:30px 34px"><div style="font-family:SG;font-size:34px;color:var(--g)">Sources</div><div class="srcs"></div></div>
 <div class="carte chat" style="margin-top:28px;padding:30px 34px;min-height:500px;position:relative">
  <div class="q" style="margin-left:auto;max-width:760px;background:var(--m);border-radius:28px 28px 6px 28px;padding:22px 28px;font-size:36px"></div>
  <div class="r" style="margin-top:24px;font-size:35px;line-height:1.45"></div>
  <div class="ext" style="margin-top:22px;border-left:8px solid var(--o);background:#FFF5E8;border-radius:12px;padding:16px 22px;font-size:28px;color:#5a4a3a;opacity:0">[1] Appel_offres_DAO.pdf, p. 12 : « Le dossier comprend : la caution de soumission, l’attestation de non-faillite, les références… »</div>
  <div class="audio" style="position:absolute;inset:30px 34px;background:#fff;opacity:0">
   <div style="font-family:SG;font-size:34px;color:var(--g)">Studio</div>
   <div style="margin-top:24px;display:flex;align-items:center;gap:20px;border:3px solid #D9C6EC;border-radius:26px;padding:24px 28px;background:#F3EAFB"><span style="font-size:48px">🎧</span><div><div style="font-size:40px;font-weight:600;color:#5B2A86">Résumé audio</div><div style="font-size:28px;color:var(--g)">Langue : Français · Format : Briefing</div></div></div>
   <div class="onde" style="margin-top:50px;height:200px;display:flex;align-items:center;gap:10px;justify-content:center"></div></div>
 </div></div></div>`);
 const S_=el.querySelector('.srcs'),q=el.querySelector('.q'),r=el.querySelector('.r'),ext=el.querySelector('.ext'),au=el.querySelector('.audio'),onde=el.querySelector('.onde');
 const srcs=SRC.map(x=>{const d=h(`<div style="display:flex;align-items:center;gap:20px;margin-top:18px"><div style="width:76px;height:56px;border-radius:10px;background:${x[1]};color:#fff;font-weight:600;font-size:22px;display:flex;align-items:center;justify-content:center">${x[0]}</div><div style="font-size:32px">${x[2]}</div><div style="margin-left:auto;color:#3E9B5A;font-size:34px">✓</div></div>`);S_.appendChild(d);return d});
 const bars=[...Array(34)].map(()=>{const b=h('<i style="display:block;width:14px;border-radius:7px;background:#8E2A8E"></i>');onde.appendChild(b);return b});
 const Q='Quelles pièces faut-il fournir ? Quelle est la date limite ?';
 const RT=['Il faut fournir la caution de soumission, l’attestation de non-faillite et vos références ','. Date limite de dépôt : le 28 novembre à 12 h '];
 return {el,u(t,d,e){srcs.forEach((x,i)=>{x.style.opacity=e==0?ap(t,.4+i*.9):1;x.style.transform=e==0?`translateX(${(1-ap(t,.4+i*.9))*-60}px)`:''});
  if(e==0){q.style.opacity=0;r.innerHTML=''}
  if(e>=1){q.style.opacity=1;tape(q,Q,e==1?(t-.2)/1.6:1)}
  if(e==1)r.innerHTML='';
  if(e>=2){const p=e==2?cl((t-.1)/1.6):1;const tot=RT[0].length+RT[1].length,n=Math.round(tot*p);
   const a=RT[0].slice(0,n),b=n>RT[0].length?RT[1].slice(0,n-RT[0].length):'';r.innerHTML=a+(n>=RT[0].length?'<span class="cit" style="background:'+(e==2&&t>2?'#F0921F':'#E9DDF4')+';color:'+(e==2&&t>2?'#fff':'#6A1E6C')+'">1</span>':'')+b+(p>=1?'<span class="cit">2</span>':'')}
  ext.style.opacity=e==2?ap(t,2.1):0;
  au.style.opacity=e==3?ap(t,.1):0; bars.forEach((b,i)=>{b.style.height=(e==3?30+120*Math.abs(Math.sin(t*5+i*.7)*Math.sin(i*.4+t*1.3)):30)+'px'})}}};
// ---------- alerte
B.alerte=(s)=>{const el=h(`<div class="scene"><div style="padding:170px 80px 0;text-align:center">
 <div class="ic" style="font-size:170px">🔒</div>
 <div class="moyen" style="margin-top:40px">Document confidentiel ?</div>
 <div class="carte" style="margin-top:60px;padding:40px;font-size:44px;line-height:1.4;text-align:left">✓ Compte <b style="color:var(--v)">professionnel</b> de l’entreprise<br><span style="color:#B3261E">✗ Jamais un compte personnel</span></div></div></div>`);
 const [ic,ti,ca]=el.firstChild.children;
 return {el,u(t){ic.style.transform=`scale(${.6+.4*ap(t,0,.5)})`;ti.style.opacity=ap(t,.3);ca.style.opacity=ap(t,.8);ca.style.transform=`translateY(${(1-ap(t,.8))*50}px)`}}};
// ---------- fin
B.fin=(s)=>{const el=h(`<div class="scene">
 <img src="dg.webp" style="position:absolute;left:-60px;bottom:-250px;height:1150px">
 <div class="txt" style="position:absolute;left:520px;right:60px;top:120px">
