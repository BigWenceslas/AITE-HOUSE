<!doctype html><html><head><meta charset="utf-8"><style>
@font-face{font-family:SG;src:url(polices/space-grotesk-latin-700-normal.woff2)}
@font-face{font-family:SG;src:url(polices/space-grotesk-latin-ext-700-normal.woff2);unicode-range:U+0100-024F}
@font-face{font-family:PX;font-weight:400;src:url(polices/ibm-plex-sans-latin-400-normal.woff2)}
@font-face{font-family:PX;font-weight:500;src:url(polices/ibm-plex-sans-latin-500-normal.woff2)}
@font-face{font-family:PX;font-weight:600;src:url(polices/ibm-plex-sans-latin-600-normal.woff2)}
:root{--v:#8E2A8E;--vf:#6A1E6C;--vn:#43124A;--o:#F0921F;--e:#1C1620;--g:#6E6675;--m:#F6ECF6;--fond:#F4F1F7}
*{box-sizing:border-box;margin:0;padding:0}
body{width:1080px;height:1920px;overflow:hidden;background:#000}
#root{position:relative;width:1080px;height:1920px;overflow:hidden;font-family:PX;color:var(--e);background:var(--fond)}
#grille{position:absolute;inset:0;background-image:radial-gradient(rgba(142,42,142,.13) 2.2px,transparent 2.6px);background-size:44px 44px}
#entete{position:absolute;left:56px;right:56px;top:64px;height:96px;display:flex;align-items:center;justify-content:space-between;z-index:20}
#logo{height:84px}
#badge{font-family:SG;font-size:30px;letter-spacing:2px;text-transform:uppercase;color:var(--v);border:3px solid var(--v);padding:12px 26px;border-radius:60px;background:#fff}
#prog{position:absolute;left:56px;right:56px;top:184px;height:6px;border-radius:6px;background:rgba(142,42,142,.15);z-index:20}
#prog i{display:block;height:100%;width:0;border-radius:6px;background:var(--v)}
#scenes{position:absolute;inset:0}
.scene{position:absolute;inset:0;opacity:0;overflow:hidden}
.vue{position:absolute;left:0;top:220px;width:1080px;height:1350px;overflow:hidden}
.cam{position:absolute;left:0;top:0;width:1080px;height:1340px;transform-origin:0 0}
#sous{position:absolute;left:48px;right:48px;top:1590px;height:210px;display:flex;align-items:center;justify-content:center;z-index:20;
 background:#fff;border-radius:34px;box-shadow:0 18px 50px rgba(67,18,74,.16);padding:22px 40px;text-align:center;font-weight:600;font-size:44px;line-height:1.28;color:#9a8fa3}
#sous span.dit{color:var(--e)} #sous span.mot{color:var(--v)}
#pied{position:absolute;left:0;right:0;bottom:40px;text-align:center;font-size:28px;color:var(--g);letter-spacing:1px;z-index:20}
#volet{position:absolute;inset:0;background:var(--v);z-index:30;transform:translateX(110%)}
#volet i{position:absolute;left:-60px;top:0;bottom:0;width:60px;background:var(--o)}
.mask{display:inline-block;overflow:hidden;vertical-align:top;padding-bottom:.08em}
.mask>span{display:inline-block}
.grand{font-family:SG;font-size:108px;line-height:1.04;letter-spacing:-1.5px;color:var(--vn)}
.grand .r{color:var(--o)}
.kicker{font-family:SG;font-size:34px;color:var(--v);text-transform:uppercase;letter-spacing:4px}
.carte{background:#fff;border-radius:34px;box-shadow:0 26px 70px rgba(67,18,74,.18)}
.pop{will-change:transform}
.outil{position:absolute;display:flex;align-items:center;gap:14px;background:#fff;border-radius:60px;padding:16px 28px 16px 16px;font-family:SG;font-size:36px;box-shadow:0 14px 40px rgba(67,18,74,.16)}
.outil i{width:52px;height:52px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:#fff;font-style:normal;font-size:28px}
.curseur{position:absolute;width:64px;height:64px;z-index:15;left:0;top:0;transform-origin:8px 6px}
.onde{position:absolute;width:30px;height:30px;border-radius:50%;border:5px solid var(--o);z-index:14;opacity:0}
.cit{display:inline-flex;align-items:center;justify-content:center;min-width:42px;height:42px;border-radius:12px;background:#EBDDF0;color:var(--vf);font-size:26px;font-weight:600;margin-left:8px;vertical-align:middle}
.caret{display:inline-block;width:4px;height:1.05em;background:var(--v);vertical-align:-0.15em;margin-left:2px}
.voile{position:absolute;inset:0;background:rgba(28,22,32,.45);opacity:0}
</style></head><body><div id="root">
<div id="grille"></div>
<div id="entete"><img id="logo" src="logo.png"><div id="badge"></div></div>
<div id="prog"><i></i></div>
<div id="scenes"></div>
<div id="sous"></div>
<div id="pied">www.aite-consulting.com</div>
<div id="volet"><i></i></div>
</div>
<script>
// ------------------------------------------------------------------ outils
const COUL=['#8E2A8E','#F0921F','#2E8CB2','#3E9B5A'];
const OUTILS=[['ChatGPT','#10A37F'],['Gemini','#4A7CF7'],['Copilot','#2E8CB2'],['Claude','#D97757'],['Le Chat','#F26B21']];
const cl=(x,a=0,b=1)=>Math.max(a,Math.min(b,x)), lerp=(a,b,p)=>a+(b-a)*p;
const eo=x=>1-Math.pow(1-cl(x),3), eio=x=>{x=cl(x);return x<.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2};
const eb=x=>{x=cl(x);const c1=1.70158,c3=c1+1;return 1+c3*Math.pow(x-1,3)+c1*Math.pow(x-1,2)};   // rebond (overshoot)
const ap=(t,d,l=.5)=>eo((t-d)/l), bp=(t,d,l=.55)=>eb((t-d)/l);
const h=(html)=>{const d=document.createElement('div');d.innerHTML=html.trim();return d.firstChild};
const rel=s=>s.replace(/\*(.+?)\*/g,'<span class="r">$1</span>');
const EV=[]; let DEBUT=0;   // évènements sonores : [temps absolu, type]
const ev=(t,type)=>EV.push([+(DEBUT+t).toFixed(3),type]);
// titre révélé mot à mot dans un masque (le mot monte depuis sa ligne)
function motsMasques(el,html){const tmp=h('<div>'+html+'</div>');const out=[];
 tmp.childNodes.forEach(n=>{const r=n.nodeType==3?'':n.className;(n.textContent).split(/\s+/).filter(Boolean).forEach(w=>{const m=h(`<span class="mask"><span class="${r}">${w}</span></span>`);el.appendChild(m);el.appendChild(document.createTextNode(' '));out.push(m.firstChild)})});return out}
function revelerMots(mots,t,d0,pas=.09){mots.forEach((m,i)=>{const p=ap(t,d0+i*pas,.55);m.style.transform=`translateY(${(1-p)*105}%) rotate(${(1-p)*6}deg)`})}
// lettres qui apparaissent une à une (logo, nom de produit)
function lettres(el,txt){return [...txt].map(c=>{const s=h(`<span style="display:inline-block;white-space:pre">${c}</span>`);el.appendChild(s);return s})}
function revelerLettres(ls,t,d0,pas=.045){ls.forEach((s,i)=>{const p=bp(t,d0+i*pas,.45);s.style.opacity=cl((t-d0-i*pas)/.15);s.style.transform=`translateY(${(1-p)*40}px) scale(${.6+.4*p})`})}
function taper(el,txt,p,caret=true){const n=Math.round(txt.length*cl(p));el.innerHTML=txt.slice(0,n).replace(/</g,'&lt;')+(caret&&p<1.02?'<span class="caret"></span>':'')}
const CURSEUR='<svg class="curseur" viewBox="0 0 24 24"><path d="M3 2l7 19 2.6-7.4L20 11z" fill="#1C1620" stroke="#fff" stroke-width="1.5" stroke-linejoin="round"/></svg>';
// curseur : trajet courbe + appui ; onde de clic
function curseur(cur,onde,t,a,b,t0,dur,tc){const p=eio((t-t0)/dur);const x=lerp(a[0],b[0],p),y=lerp(a[1],b[1],p)-Math.sin(Math.PI*p)*120;
 cur.style.transform=`translate(${x}px,${y}px) scale(${t>tc&&t<tc+.18?.82:1})`;
 const q=(t-tc)/.6;onde.style.opacity=q>0&&q<1?1-q:0;onde.style.transform=`translate(${b[0]-15}px,${b[1]-15}px) scale(${1+q*4})`}
// caméra : interpolation entre deux cadrages {s,x,y} (x,y = point visé, en coordonnées de la scène)
function camera(cam,a,b,p){const s=lerp(a.s,b.s,p),x=lerp(a.x,b.x,p),y=lerp(a.y,b.y,p);cam.style.transform=`translate(${540-x*s}px,${670-y*s}px) scale(${s})`}
const C0={s:1,x:540,y:670};
const B={};
// ------------------------------------------------------------- ouverture
B.titre=(s,deb)=>{const el=h(`<div class="scene"><div class="vue"><div class="cam">
 <div class="rond" style="position:absolute;left:500px;top:640px;width:660px;height:660px;border-radius:50%;background:linear-gradient(160deg,#9C319C,#5A1760)"></div>
 <img class="dg" src="dg.webp" style="position:absolute;left:560px;top:450px;height:1050px">
 <div style="position:absolute;left:64px;top:40px;width:960px"><div class="kicker">${s.kicker}</div><div class="grand t" style="margin-top:26px"></div></div>
 <div class="nom" style="position:absolute;left:64px;top:1060px"><div style="font-family:SG;font-size:38px;color:var(--vn)">Cyrille Donald ABOLO</div><div style="font-size:28px;color:var(--g);margin-top:4px">Directeur Général, AITE Consulting</div></div>
 </div></div>`);
 const T=el.querySelector('.t'),mots=motsMasques(T,rel(s.titre)),rond=el.querySelector('.rond'),dg=el.querySelector('.dg'),nom=el.querySelector('.nom'),kick=el.querySelector('.kicker');
 const fl=(s.flottants||OUTILS.map(o=>o[0])).map((n,i)=>{const o=OUTILS.find(x=>x[0]==n)||[n,COUL[i%4]];const c=h(`<div class="outil pop"><i style="background:${o[1]}">${s.icones?s.icones[i]:'✦'}</i>${n}</div>`);el.firstChild.appendChild(c);return c});
 const POS=[[40,560],[40,720],[250,640],[60,880],[250,800]];
 ev(.15,'pop');ev(.9,'pop');
 return {el,u(t,d){kick.style.opacity=ap(t,0,.4);revelerMots(mots,t,.1);
  const r=bp(t,.25,.7);rond.style.transform=`scale(${r})`;dg.style.transform=`translateY(${(1-ap(t,.35,.8))*500}px)`;dg.style.opacity=ap(t,.35,.3);
  nom.style.opacity=ap(t,1.2);nom.style.transform=`translateX(${(1-ap(t,1.2))*-40}px)`;
  fl.forEach((c,i)=>{const p=bp(t,.9+i*.14,.5),[x,y]=POS[i%5];c.style.opacity=cl((t-.9-i*.14)/.15);c.style.transform=`translate(${x+Math.sin(t*1.3+i)*10}px,${y+Math.cos(t*1.1+i*2)*12}px) scale(${p})`});
  el.firstChild.style.transform=`scale(${1+.04*cl(t/d)})`;el.firstChild.style.transformOrigin='540px 600px'}}};
// --------------------------------------------------------- cartes numérotées
B.chips=(s)=>{const el=h(`<div class="scene"><div class="vue"><div class="cam"><div style="position:absolute;left:64px;top:110px;width:950px" class="grand t"></div><div class="liste"></div></div></div>`);
 const mots=motsMasques(el.querySelector('.t'),rel(s.titre));el.querySelector('.t').style.fontSize='84px';
 const L=el.querySelector('.liste');
 const items=s.items.map((x,i)=>{const c=h(`<div class="carte pop" style="position:absolute;left:${i%2?560:64}px;top:${440+Math.floor(i/2)*330}px;width:456px;height:290px;padding:34px;display:flex;flex-direction:column;justify-content:space-between">
  <div style="width:84px;height:84px;border-radius:24px;background:${COUL[i]};color:#fff;font-family:SG;font-size:50px;display:flex;align-items:center;justify-content:center">${i+1}</div>
  <div style="font-family:SG;font-size:58px;color:var(--vn)">${x}</div></div>`);L.appendChild(c);return c});
 items.forEach((c,i)=>ev(.6+i*.35,'pop'));
 return {el,u(t,d){revelerMots(mots,t,0);items.forEach((c,i)=>{const p=bp(t,.6+i*.35,.55);c.style.opacity=cl((t-.6-i*.35)/.12);c.style.transform=`translateY(${(1-p)*120}px) scale(${.7+.3*p}) rotate(${(1-p)*(i%2?4:-4)}deg)`})}}};
// ----------------------------------------------------------- outils en orbite
B.outils=(s)=>{const el=h(`<div class="scene"><div class="vue"><div class="cam">
 <div style="position:absolute;left:64px;top:90px;width:950px" class="grand t"></div>
 <div class="centre carte pop" style="position:absolute;left:240px;top:560px;width:600px;padding:40px;text-align:center">
  <div style="font-size:30px;color:var(--g)">La formule</div><div style="font-family:SG;font-size:46px;color:var(--vn);margin-top:10px;line-height:1.25">Rôle · Tâche<br>Contexte · Format</div></div></div></div>`);
 const T=el.querySelector('.t');T.style.fontSize='84px';const mots=motsMasques(T,rel(s.titre)),ce=el.querySelector('.centre');
 const POS=[[70,420],[640,430],[30,960],[620,980],[330,1130]];
 const ch=OUTILS.map((o,i)=>{const c=h(`<div class="outil pop"><i style="background:${o[1]}">✓</i>${o[0]}${o[0]=='Le Chat'?' (Mistral)':''}</div>`);el.firstChild.appendChild(c);return c});
 ev(.3,'pop');ch.forEach((c,i)=>ev(.9+i*.4,'pop'));
 return {el,u(t){revelerMots(mots,t,0);const p=bp(t,.3,.6);ce.style.transform=`scale(${p})`;ce.style.opacity=cl((t-.3)/.1);
  ch.forEach((c,i)=>{const q=bp(t,.9+i*.4,.5),[x,y]=POS[i];c.style.opacity=cl((t-.9-i*.4)/.12);c.style.transform=`translate(${x+Math.sin(t*1.4+i)*12}px,${y+Math.cos(t*1.2+i)*12}px) scale(${q})`})}}};
// ------------------------------------------------------------ prompt (chat)
const SEG=['Tu es mon assistant de direction. ','Rédige une relance pour un client. ','Il doit 2 factures depuis 45 jours, mais c’est un bon client depuis 5 ans : cordial mais ferme. ','Format : un message WhatsApp de 5 lignes maximum.'];
const NOMS=['Rôle','Tâche','Contexte','Format'];
B.chat=(s)=>{const el=h(`<div class="scene"><div class="vue"><div class="cam">
 <div class="pills" style="position:absolute;left:64px;top:60px;display:flex;gap:14px"></div>
 <div class="carte fen" style="position:absolute;left:56px;top:200px;width:968px;height:1020px;padding:40px 44px">
  <div style="display:flex;align-items:center;gap:16px;font-family:SG;font-size:32px;color:var(--g)"><span style="width:20px;height:20px;border-radius:50%;background:#3E9B5A"></span>Votre IA · nouvelle conversation</div>
  <div class="zone" style="margin-top:34px;border:3px solid #E7E3EC;border-radius:28px;padding:34px;font-size:52px;line-height:1.42;height:760px"></div>
  <div class="env" style="position:absolute;right:44px;bottom:36px;background:var(--v);color:#fff;font-family:SG;font-size:36px;padding:18px 38px;border-radius:44px">Envoyer ➜</div>
 </div>${CURSEUR}<div class="onde"></div></div></div>`);
 const cam=el.querySelector('.cam'),P=el.querySelector('.pills'),Z=el.querySelector('.zone'),env=el.querySelector('.env'),cur=el.querySelector('.curseur'),onde=el.querySelector('.onde');
 const pills=NOMS.map((n,i)=>{const p=h(`<div style="font-family:SG;font-size:36px;padding:14px 26px;border-radius:50px;border:3px solid ${COUL[i]};color:${COUL[i]};background:#fff">${i+1}. ${n}</div>`);P.appendChild(p);return p});
 const segs=SEG.map(()=>{const sp=h(`<span style="border-radius:10px;padding:0 4px"></span>`);Z.appendChild(sp);return sp});
 // cadrages : on s'approche du segment en cours
 const CAD=[{s:1.12,x:540,y:470},{s:1.12,x:540,y:540},{s:1.1,x:540,y:680},{s:1.06,x:540,y:760}];
 if(s.dernier)ev(s.duree-1.25,'clic');
 if(s.etape==0){ev(0,'pop')}
 return {el,u(t,d,e){
  const fin=e==SEG.length-1;const prev=e==0?C0:CAD[e-1];let p=eio((t)/.8);let cad=CAD[e];
  if(fin&&t>d-1.9){const q=eio((t-(d-1.9))/.7);camera(cam,CAD[e],C0,q)}else camera(cam,e==0?{s:1,x:540,y:670}:prev,cad,e==0?eio((t-.4)/.9):p);
  if(e==0){el.querySelector('.fen').style.transform=`translateY(${(1-bp(t,0,.7))*300}px)`;P.style.opacity=ap(t,.2)}else el.querySelector('.fen').style.transform='';
  pills.forEach((x,i)=>{const act=i==e;x.style.background=act?COUL[i]:i<e?'#fff':'#fff';x.style.color=act?'#fff':COUL[i];x.style.opacity=i<=e?1:.35;x.style.transform=act?`scale(${1+.12*Math.sin(Math.PI*cl(t/.45))})`:''});
  segs.forEach((sp,i)=>{if(i<e){sp.textContent=SEG[i]}else if(i==e){taper(sp,SEG[i],(t-.35)/(Math.max(1.2,d*.62)))}else sp.textContent='';
   sp.style.background=i==e?COUL[i]+'22':'transparent';sp.style.color=i==e?'#1C1620':'#8a8190'});
  cur.style.opacity=fin&&t>d-2.2?1:0;onde.style.opacity=0;
  if(fin){curseur(cur,onde,t,[980,1350],[880,1185],d-2.2,.9,d-1.25);env.style.transform=t>d-1.25&&t<d-1.05?'scale(.92)':'';}
 }}};
// ------------------------------------------------------------ messagerie
const MSG=[['AN','Aline N.','On ne peut pas livrer le 12, le camion…'],['PK','Paul K.','Si on décale au 20, il faut prévenir…'],['MT','Marc T.','Le client accepte, mais il veut garder…'],['AN','Aline N.','Je relance le transporteur demain…']];
const RES=[['La livraison passe du 12 au 20 novembre.',2],['Le client accepte si la remise de 5 % reste.',3],['Aline relance le transporteur demain.',4]];
B.mail=(s)=>{const el=h(`<div class="scene"><div class="vue"><div class="cam">
 <div class="carte fen" style="position:absolute;left:50px;top:40px;width:980px;padding:36px 38px">
  <div style="font-family:SG;font-size:42px;color:var(--vn)">Livraison chantier Bonapriso</div><div style="font-size:30px;color:var(--g);margin-top:6px">40 messages · 6 participants</div>
  <div class="barre" style="margin-top:26px;border-radius:24px;border:3px solid #D9C6EC;background:linear-gradient(90deg,#F3EAFB,#EAF2FB);padding:22px 26px">
   <div style="display:flex;align-items:center;gap:16px;font-size:38px;font-weight:600;color:#5B2A86"><span style="font-size:42px">✦</span>Résumé par Copilot</div>
   <div class="res" style="overflow:hidden;height:0"></div></div>
  <div class="msgs" style="margin-top:20px"></div>
 </div>
 <div class="voile"></div>
 <div class="modal carte" style="position:absolute;left:90px;top:330px;width:900px;padding:40px;opacity:0">
  <div style="display:flex;align-items:center;gap:22px"><div style="width:84px;height:100px;border-radius:12px;background:#D93F3F;color:#fff;font-weight:600;font-size:28px;display:flex;align-items:center;justify-content:center">PDF</div>
  <div><div style="font-size:38px;font-weight:600">Planning_livraison.pdf</div><div style="font-size:28px;color:var(--g)">pièce jointe · 2,4 Mo</div></div></div>
  <div class="bf" style="display:inline-block;margin-top:30px;font-size:34px;font-weight:600;color:#5B2A86;border:3px solid #D9C6EC;border-radius:44px;padding:16px 30px">✦ Résumer un fichier</div>
  <div class="rf" style="margin-top:26px;font-size:32px;line-height:1.45;color:var(--e)"></div></div>
 ${CURSEUR}<div class="onde"></div></div></div>`);
 const cam=el.querySelector('.cam'),M=el.querySelector('.msgs'),R=el.querySelector('.res'),barre=el.querySelector('.barre'),cur=el.querySelector('.curseur'),onde=el.querySelector('.onde'),voile=el.querySelector('.voile'),modal=el.querySelector('.modal'),bf=el.querySelector('.bf'),rf=el.querySelector('.rf'),fen=el.querySelector('.fen');
 const msgs=MSG.map((m,i)=>{const d=h(`<div style="display:flex;gap:22px;padding:22px 10px;border-top:2px solid #EEE;border-radius:18px"><div style="width:74px;height:74px;border-radius:50%;background:${COUL[i%4]};color:#fff;display:flex;align-items:center;justify-content:center;font-weight:600;font-size:28px;flex:none">${m[0]}</div><div><div style="font-size:34px;font-weight:600">${m[1]} <span style="font-weight:400;color:var(--g);font-size:28px">· message ${i+1}</span></div><div style="font-size:32px;color:var(--g)">${m[2]}</div></div></div>`);M.appendChild(d);return d});
 const lignes=RES.map(r=>{const d=h(`<div style="font-size:36px;line-height:1.35;margin-top:16px;display:flex;gap:14px"><span style="color:#5B2A86">•</span><span>${r[0]}<span class="cit">${r[1]}</span></span></div>`);R.appendChild(d);return d});
 const CAD=[C0,{s:1.3,x:470,y:300},{s:1.08,x:540,y:440},{s:1.2,x:560,y:470},C0];
 const e=s.etape;
 if(e==0)msgs.forEach((m,i)=>ev(.25+i*.18,'pop'));
 if(e==1)ev(1.45,'clic'); if(e==2)lignes.forEach((l,i)=>ev(.45+i*.5,'pop')); if(e==3)ev(.9,'clic'); if(e==4){ev(.25,'pop');ev(1.7,'clic')}
 return {el,u(t,d,e){
  camera(cam,e==0?C0:CAD[e-1],CAD[e],e==0?1:eio(t/.8));
  if(e==0)fen.style.transform=`translateY(${(1-bp(t,0,.7))*260}px)`;else fen.style.transform='';
  msgs.forEach((m,i)=>{const p=e==0?bp(t,.25+i*.18,.5):1;m.style.opacity=e==0?cl((t-.25-i*.18)/.15):1;m.style.transform=`translateX(${(1-p)*-80}px)`;m.style.display=(e==2||e==3)&&i>1?'none':'flex';m.style.background=(e==3&&i==1&&t>1)?'#FCEFDF':'transparent'});
