; Configuration Odoo 18 des tests de la caisse du restaurant (tests Odoo et tours,
; partie 6.4 de la spécification du lot 1).
; Les chemins sont relatifs au dossier d'Odoo 18, placé à côté du dépôt (../odoo18) :
;   cd ../odoo18 && $PYTHON odoo-bin -c ../AITE-HOUSE/dev/odoo_tours.conf -d aite_rest_<rôle> ...
; Port propre (8379) : un serveur de développement peut tourner sur 8069 pendant les tours.
; data_dir hors du dépôt : les bases jetables n'écrivent rien dans dev/filestore.
[options]
addons_path = addons,../AITE-HOUSE/addons
db_host = localhost
db_port = 5432
db_user = odoo
db_password = odoo
data_dir = ../aite_house_tours_data
admin_passwd = admin
http_port = 8379
gevent_port = 8380
log_level = info
limit_time_cpu = 600
limit_time_real = 1200
